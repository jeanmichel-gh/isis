# isis4r between two areas: Level 1 with f1 in 49.0001, Level 2 with f2
# in 49.0002. See ../isis4r-frr.clab.yml.
system_id: 0000.0000.0001
hostname: r1
areas: [49.0001]
level: 1-2
metric_style: wide
forwarding: true
prefixes:
  - { prefix: 10.255.0.1/32, metric: 0 }
interfaces:
  - { name: eth1, ip_addresses: [10.0.12.1], metric: 10, hello_interval: 1, hello_multiplier: 3 }
  - { name: eth2, ip_addresses: [10.0.13.1], metric: 10, hello_interval: 1, hello_multiplier: 3 }
