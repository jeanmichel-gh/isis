# b2, the border of area 49.0002: Level 1 with s2 and its grid, Level 2
# with the other two borders. See ../isis4r-areas.clab.yml.
#
# eth1 and eth2 face borders in other areas, so only Level 2 comes up
# there: two Level 1 systems need an area address in common (RFC 1142
# section 7.1.3). eth3 faces s2 and eth4 faces r2, both Level 1 only.
system_id: 0000.0000.0002
hostname: b2
areas: [49.0002]
level: 1-2
metric_style: wide
forwarding: true
# Regenerate an LSP 1 s after a change, not the default 30 s, so the other
# borders see a change in the area within the time the scenarios allow.
minimum_lsp_interval: 1
prefixes:
  - { prefix: 10.255.0.2/32, metric: 0 }
interfaces:
  - { name: eth1, ip_addresses: [10.0.12.2], metric: 10, hello_interval: 1, hello_multiplier: 3 }   # to b1
  - { name: eth2, ip_addresses: [10.0.23.1], metric: 10, hello_interval: 1, hello_multiplier: 3 }   # to b3
  - { name: eth3, ip_addresses: [10.2.0.1], metric: 10, hello_interval: 1, hello_multiplier: 3 }   # to s2
  - { name: eth4, ip_addresses: [10.2.1.1], metric: 10, hello_interval: 1, hello_multiplier: 3 }   # to r2
