# r1, a Level 1 router in area 49.0001, beside s1's grid. See
# ../isis4r-areas.clab.yml.
#
# It knows only its own area. Everything else it reaches by the default
# route its Level 1 decision adds toward b1, the attached Level 2 system
# (RFC 1142 section 7.2.12). When b1 is cut off from Level 2, b1 clears
# its attached bit (section 7.2.9.2), and the default route goes.
system_id: 0000.0000.0021
hostname: r1
areas: [49.0001]
level: 1
metric_style: wide
forwarding: true
minimum_lsp_interval: 1
prefixes:
  - { prefix: 10.255.0.21/32, metric: 0 }
interfaces:
  - { name: eth1, ip_addresses: [10.1.1.2], metric: 10, hello_interval: 1, hello_multiplier: 3 }   # to b1
  - { name: eth2, ip_addresses: [10.1.2.1], metric: 10, hello_interval: 1, hello_multiplier: 3 }   # to s1
