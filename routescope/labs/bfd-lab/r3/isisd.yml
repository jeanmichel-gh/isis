# r3 in bfd-lab (routescope/labs/bfd-lab): hellos at isisd's defaults,
# BFD on every link.
system_id: 0000.0000.0003
hostname: r3
areas: [49.0001]
level: 1
metric_style: wide
forwarding: true
prefixes:
  - { prefix: 10.255.0.3/32, metric: 0 }
interfaces:
  - { name: eth1, ip_addresses: [10.0.13.2], metric: 30, bfd: true }
  - { name: eth2, ip_addresses: [10.0.23.2], metric: 10, bfd: true }
