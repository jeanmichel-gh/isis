name: Loss on r1 to r2, with BFD
description: >-
  100% loss on the r1 to r2 link, which stays up. BFD on both ends
  sees it within its 900 ms detection time, isisd drops the adjacency,
  and r1's traffic to r3 moves to the direct link. Then the same again
  right after the link came back, while r1's LSP that said so is
  recent: the backoff holds the next change 1 s or a few, not 30.
timeout: 240
steps:
  - expect: { isis_adjacencies: { node: r1, up: 2 } }
    within: 60
  - expect: { bfd_session: { node: r1, peer: 10.0.12.2, state: up } }
    within: 30
  - expect: { bfd_session: { node: r2, peer: 10.0.12.1, state: up } }
    within: 30
  - expect: { isis_route: { node: r1, prefix: 10.255.0.3/32, next_hop: 10.0.12.2 } }
    within: 30

  - mark: 100% loss on r1 to r2
  - netem: r1:eth1
    loss: 100%
  - expect: { ping: { node: r1, from: 10.255.0.1, to: 10.255.0.3, count: 3 } }
    within: 60
    measure: failover
  - expect: { isis_route: { node: r1, prefix: 10.255.0.3/32, next_hop: 10.0.13.2 } }
  # BFD Down took the adjacency down, so isisd lets go of the session, and
  # bfdd4r shows it admin_down until it removes it a Detection Time later.
  # So the check is that it goes, not that it reads down at one moment.
  - expect: { bfd_session: { node: r1, peer: 10.0.12.2, state: absent } }
    within: 15

  - mark: the loss cleared
  - netem: r1:eth1
    clear: true
  - expect: { isis_route: { node: r1, prefix: 10.255.0.3/32, next_hop: 10.0.12.2 } }
    within: 60
    measure: restore
  - expect: { bfd_session: { node: r1, peer: 10.0.12.2, state: up } }
    within: 30

  # The link came back a moment ago, so r1 has just sent an LSP. Fixed at
  # 30 s, the LSP that says it is gone again would be held up to 30 s.
  # The backoff holds it 1 s after a quiet time, and twice as long with
  # each change of r1's in the last 30 s: 8 s after a run just before.
  - mark: 100% loss on r1 to r2 again, right after
  - netem: r1:eth1
    loss: 100%
  - expect: { ping: { node: r1, from: 10.255.0.1, to: 10.255.0.3, count: 3 } }
    within: 60
    measure: failover_again
  - expect: { isis_route: { node: r1, prefix: 10.255.0.3/32, next_hop: 10.0.13.2 } }

  - mark: the loss cleared
  - netem: r1:eth1
    clear: true
  - expect: { isis_route: { node: r1, prefix: 10.255.0.3/32, next_hop: 10.0.12.2 } }
    within: 60
  - expect: { bfd_session: { node: r1, peer: 10.0.12.2, state: up } }
    within: 30
