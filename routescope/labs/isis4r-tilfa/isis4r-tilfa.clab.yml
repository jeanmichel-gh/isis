# isis's lab for testing TI-LFA (RFC 9855): six isis4r routers and one
# FRR in a ring, a chord from r5 to r2, and an isis4r-sim behind r3.
# routescope docs/design/ti-lfa.md, step 6e3; ABOUT.md says what each
# scenario checks.
#
#   f1 ----- r1 ----- r2 ----- r3 ----- s1 -- t1 (simulated)
#   |    10      10   |   10   |   10
# 10|               10|      10|
#   |                 |        |
#   r6 ------------- r5 ------ r4
#          1000          1000
#
#   r1  21000   r2  22000   r3  23000   r4  24000   SRGB start; Node-SID
#   r5  25000   r6  26000   f1  16000 (FRR)         index N on 10.255.0.N
#   s1  19000, index 9      t1  30000, index 10     simulated by s1
#
# Links 10.0.AB.0/30 between rA and rB, f1 as 7, s1 as 9: r1-r2
# 10.0.12.0/30, r1-f1 10.0.17.0/30, r6-f1 10.0.67.0/30, r3-s1
# 10.0.39.0/30. The two links at 1000, r4-r5 and r5-r6, keep P and Q
# apart: with r2 down, r1's repair to r3 is Node-SID(r6), then Adj-SIDs
# r6-r5 and r5-r4, through f1 (RFC 9855 5.4).
#
# TI-LFA: r1's eth1, toward r2, with `ti_lfa: node`; f1's eth1, toward
# r1, `isis fast-reroute ti-lfa level-2`.
#
# Label routes need the mpls_router and mpls_iptunnel modules on the host
# (the lab VMs load them at boot). Each isis4r node sets its label table
# size through /proc, since the isis4r image has no sysctl.
#
# Images: isis4r:latest, built in an isis checkout beside datalink-socket
# and bfd4r, and FRR:
#   docker build -t isis4r --build-context datalink-socket=../datalink-socket --build-context bfd4r=../bfd4r .
#   docker pull quay.io/frrouting/frr:10.7.1
#   sudo containerlab deploy -t isis4r-tilfa.clab.yml
name: isis4r-tilfa

topology:
  defaults:
    labels: { routescope.protocols: isis }
  nodes:
    r1:
      kind: linux
      image: isis4r:latest
      binds: [r1:/etc/isis4r]
      entrypoint: sh
      cmd: >-
        -c "for i in eth1 eth2; do until ip link show $i >/dev/null 2>&1; do sleep 0.2; done; done;
        ip addr add 10.0.12.1/30 dev eth1; ip addr add 10.0.17.1/30 dev eth2;
        ip addr add 10.255.0.1/32 dev lo; ip route del default dev eth0 2>/dev/null;
        echo 1 > /proc/sys/net/ipv4/ip_forward; echo 100000 > /proc/sys/net/mpls/platform_labels;
        exec isisd -c /etc/isis4r/isisd.yml -l -"
    r2:
      kind: linux
      image: isis4r:latest
      binds: [r2:/etc/isis4r]
      entrypoint: sh
      cmd: >-
        -c "for i in eth1 eth2 eth3; do until ip link show $i >/dev/null 2>&1; do sleep 0.2; done; done;
        ip addr add 10.0.12.2/30 dev eth1; ip addr add 10.0.23.1/30 dev eth2; ip addr add 10.0.25.1/30 dev eth3;
        ip addr add 10.255.0.2/32 dev lo; ip route del default dev eth0 2>/dev/null;
        echo 1 > /proc/sys/net/ipv4/ip_forward; echo 100000 > /proc/sys/net/mpls/platform_labels;
        exec isisd -c /etc/isis4r/isisd.yml -l -"
    r3:
      kind: linux
      image: isis4r:latest
      binds: [r3:/etc/isis4r]
      entrypoint: sh
      cmd: >-
        -c "for i in eth1 eth2 eth3; do until ip link show $i >/dev/null 2>&1; do sleep 0.2; done; done;
        ip addr add 10.0.23.2/30 dev eth1; ip addr add 10.0.34.1/30 dev eth2; ip addr add 10.0.39.1/30 dev eth3;
        ip addr add 10.255.0.3/32 dev lo; ip route del default dev eth0 2>/dev/null;
        echo 1 > /proc/sys/net/ipv4/ip_forward; echo 100000 > /proc/sys/net/mpls/platform_labels;
        exec isisd -c /etc/isis4r/isisd.yml -l -"
    r4:
      kind: linux
      image: isis4r:latest
      binds: [r4:/etc/isis4r]
      entrypoint: sh
      cmd: >-
        -c "for i in eth1 eth2; do until ip link show $i >/dev/null 2>&1; do sleep 0.2; done; done;
        ip addr add 10.0.34.2/30 dev eth1; ip addr add 10.0.45.1/30 dev eth2;
        ip addr add 10.255.0.4/32 dev lo; ip route del default dev eth0 2>/dev/null;
        echo 1 > /proc/sys/net/ipv4/ip_forward; echo 100000 > /proc/sys/net/mpls/platform_labels;
        exec isisd -c /etc/isis4r/isisd.yml -l -"
    r5:
      kind: linux
      image: isis4r:latest
      binds: [r5:/etc/isis4r]
      entrypoint: sh
      cmd: >-
        -c "for i in eth1 eth2 eth3; do until ip link show $i >/dev/null 2>&1; do sleep 0.2; done; done;
        ip addr add 10.0.45.2/30 dev eth1; ip addr add 10.0.56.1/30 dev eth2; ip addr add 10.0.25.2/30 dev eth3;
        ip addr add 10.255.0.5/32 dev lo; ip route del default dev eth0 2>/dev/null;
        echo 1 > /proc/sys/net/ipv4/ip_forward; echo 100000 > /proc/sys/net/mpls/platform_labels;
        exec isisd -c /etc/isis4r/isisd.yml -l -"
    # r6 starts 20 s after the others. isisd gives an Adj-SID the lowest
    # free SRLB label when the adjacency first comes up, and keeps it, so
    # r5 takes 15000 toward r4 first and 15001 toward r6, on every run.
    r6:
      kind: linux
      image: isis4r:latest
      binds: [r6:/etc/isis4r]
      entrypoint: sh
      cmd: >-
        -c "for i in eth1 eth2; do until ip link show $i >/dev/null 2>&1; do sleep 0.2; done; done;
        ip addr add 10.0.56.2/30 dev eth1; ip addr add 10.0.67.1/30 dev eth2;
        ip addr add 10.255.0.6/32 dev lo; ip route del default dev eth0 2>/dev/null;
        echo 1 > /proc/sys/net/ipv4/ip_forward; echo 100000 > /proc/sys/net/mpls/platform_labels;
        sleep 20; exec isisd -c /etc/isis4r/isisd.yml -l -"
    # s1 simulates t1; the same image as the routers, told apart by its
    # command and its labels.
    s1:
      kind: linux
      image: isis4r:latest
      labels:
        routescope.kind: isis4r-sim
        routescope.protocols: isis
      binds: [s1:/lab]
      entrypoint: sh
      cmd: >-
        -c "until ip link show eth1 >/dev/null 2>&1; do sleep 0.2; done;
        ip addr add 10.0.39.2/30 dev eth1; ip addr add 10.255.0.9/32 dev lo;
        ip route del default dev eth0 2>/dev/null;
        exec isis4r-sim -c /lab/sim.yml -l -"
    f1:
      kind: linux
      image: quay.io/frrouting/frr:10.7.1
      binds: [f1:/etc/frr]
      exec:
        - sh -c "ip route del default dev eth0 2>/dev/null || true"
        - sysctl -qw net.mpls.platform_labels=100000 net.mpls.conf.eth1.input=1 net.mpls.conf.eth2.input=1
  links:
    - endpoints: ["r1:eth1", "r2:eth1"]
    - endpoints: ["r1:eth2", "f1:eth1"]
    - endpoints: ["r2:eth2", "r3:eth1"]
    - endpoints: ["r2:eth3", "r5:eth3"]
    - endpoints: ["r3:eth2", "r4:eth1"]
    - endpoints: ["r3:eth3", "s1:eth1"]
    - endpoints: ["r4:eth2", "r5:eth1"]
    - endpoints: ["r5:eth2", "r6:eth1"]
    - endpoints: ["r6:eth2", "f1:eth2"]
