frr version 10.7.1_git
frr defaults traditional
hostname f1
log stdout informational
service integrated-vtysh-config
!
interface lo
 ip address 10.255.0.7/32
 ip router isis 1
 isis passive
exit
!
interface eth1
 ip address 10.0.17.2/30
 ip router isis 1
 isis network point-to-point
 isis metric 10
 isis hello-interval 1
 isis hello-multiplier 10
 isis fast-reroute ti-lfa level-2
exit
!
interface eth2
 ip address 10.0.67.2/30
 ip router isis 1
 isis network point-to-point
 isis metric 10
 isis hello-interval 1
 isis hello-multiplier 10
exit
!
router isis 1
 net 49.0001.0000.0000.0007.00
 is-type level-2-only
 metric-style wide
 lsp-gen-interval 1
 segment-routing on
 segment-routing global-block 16000 16999
 segment-routing local-block 15000 15999
 segment-routing prefix 10.255.0.7/32 index 7
exit
