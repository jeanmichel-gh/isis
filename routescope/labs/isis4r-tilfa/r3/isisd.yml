# isis4r in the TI-LFA ring. See ../isis4r-tilfa.clab.yml.
system_id: 0000.0000.0003
hostname: r3
areas: [49.0001]
level: 2
metric_style: wide
minimum_lsp_interval: 1
forwarding: true
segment_routing:
  srgb: [{ start: 23000, size: 1000 }]
  srlb: { start: 15000, size: 1000 }
prefixes:
  - { prefix: 10.255.0.3/32, metric: 0, sid: 3 }
interfaces:
  - { name: eth1, ip_addresses: [10.0.23.2], metric: 10, hello_interval: 1, hello_multiplier: 10 }
  - { name: eth2, ip_addresses: [10.0.34.1], metric: 10, hello_interval: 1, hello_multiplier: 10 }
  - { name: eth3, ip_addresses: [10.0.39.1], metric: 10, hello_interval: 1, hello_multiplier: 10 }
