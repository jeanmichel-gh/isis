# isis4r in three IS-IS areas around a Level 2-only backbone router. In
# each area a Level 1-2 border, a Level 1 router, and an isis4r simulator
# with a 3x3 grid of Level 1 systems behind it. The design is routescope
# docs/design/isis-areas-core.md; ABOUT.md says what to look for.
#
#                    c0 (isisd, L2 only, 49.0000)
#                  /          |               \
#     b1 (L1-2) ------- b2 (L1-2)            b3 (L1-2)
#     /      \          /      \             /      \
#  r1 (L1) - s1      r2 (L1) - s2         r3 (L1) - s3
#             |                 |                    |
#         grid 3x3          grid 3x3             grid 3x3
#         49.0001           49.0002              49.0003
#         leaking           summaries            false ATT
#
# Links, every metric 10, every one point-to-point:
#
#   c0 eth1  10.0.1.0/30   --  b1 eth1     Level 2
#   c0 eth2  10.0.2.0/30   --  b2 eth1     Level 2
#   c0 eth3  10.0.3.0/30   --  b3 eth1     Level 2
#   b1 eth2  10.0.12.0/30  --  b2 eth2     Level 2
#   bN eth3  10.N.0.0/30   --  sN eth1     Level 1
#   bN eth4  10.N.1.0/30   --  rN eth1     Level 1
#   rN eth2  10.N.2.0/30   --  sN eth2     Level 1
#
# Loopbacks: c0 10.255.0.100, bN 10.255.0.N, sN 10.255.0.1N, rN 10.255.0.2N.
# Area N's grid: 0000.000N.0101 (r1c1) to 0000.000N.0303 (r3c3), loopbacks
# 10.20N.0.1 to 10.20N.0.9, and 3N.0.0.0/24 x 10 on r3c3.
#
# Areas 1 and 2 reach the backbone two ways, c0 and each other. Area 3
# has one, through c0.
#
# Build the image from an isis4r checkout beside datalink-socket:
#   docker build -t isis4r --build-context datalink-socket=../datalink-socket .
# Then install it into ~/labs with
#   routescope-labs install isis/isis4r-areas-core
# and start it from routescope's lab menu, or here:
#   sudo containerlab deploy -t isis4r-areas-core.clab.yml
# test/lab/isis4r-areas-core.sh runs it and checks it, in containerlab or
# in network namespaces.
name: isis4r-areas-core

topology:
  defaults:
    labels: { routescope.protocols: isis }
  nodes:
    # isisd opens its interfaces when it starts, so it waits for
    # containerlab to wire them, and has its addresses before it does.
    c0:
      kind: linux
      image: isis4r:latest
      labels: { routescope.kind: isis4r, routescope.protocols: isis }
      binds: [c0:/etc/isis4r]
      entrypoint: sh
      cmd: >-
        -c "until ip link show eth3 >/dev/null 2>&1; do sleep 0.2; done;
        ip addr add 10.0.1.1/30 dev eth1; ip addr add 10.0.2.1/30 dev eth2; ip addr add 10.0.3.1/30 dev eth3;
        ip addr add 10.255.0.100/32 dev lo;
        ip route del default dev eth0 2>/dev/null; sysctl -qw net.ipv4.ip_forward=1;
        exec isisd -c /etc/isis4r/isisd.yml -l -"
    b1:
      kind: linux
      image: isis4r:latest
      labels: { routescope.kind: isis4r, routescope.protocols: isis }
      binds: [b1:/etc/isis4r]
      entrypoint: sh
      cmd: >-
        -c "until ip link show eth4 >/dev/null 2>&1; do sleep 0.2; done;
        ip addr add 10.0.1.2/30 dev eth1; ip addr add 10.0.12.1/30 dev eth2; ip addr add 10.1.0.1/30 dev eth3; ip addr add 10.1.1.1/30 dev eth4;
        ip addr add 10.255.0.1/32 dev lo;
        ip route del default dev eth0 2>/dev/null; sysctl -qw net.ipv4.ip_forward=1;
        exec isisd -c /etc/isis4r/isisd.yml -l -"
    r1:
      kind: linux
      image: isis4r:latest
      labels: { routescope.kind: isis4r, routescope.protocols: isis }
      binds: [r1:/etc/isis4r]
      entrypoint: sh
      cmd: >-
        -c "until ip link show eth2 >/dev/null 2>&1; do sleep 0.2; done;
        ip addr add 10.1.1.2/30 dev eth1; ip addr add 10.1.2.1/30 dev eth2;
        ip addr add 10.255.0.21/32 dev lo;
        ip route del default dev eth0 2>/dev/null; sysctl -qw net.ipv4.ip_forward=1;
        exec isisd -c /etc/isis4r/isisd.yml -l -"
    s1:
      kind: linux
      image: isis4r:latest
      labels: { routescope.kind: isis4r-sim, routescope.protocols: isis }
      binds: [s1:/lab]
      entrypoint: sh
      cmd: >-
        -c "until ip link show eth2 >/dev/null 2>&1; do sleep 0.2; done;
        ip addr add 10.1.0.2/30 dev eth1; ip addr add 10.1.2.2/30 dev eth2;
        ip addr add 10.255.0.11/32 dev lo;
        exec isis4r-sim -c /lab/sim.yml -l -"
    b2:
      kind: linux
      image: isis4r:latest
      labels: { routescope.kind: isis4r, routescope.protocols: isis }
      binds: [b2:/etc/isis4r]
      entrypoint: sh
      cmd: >-
        -c "until ip link show eth4 >/dev/null 2>&1; do sleep 0.2; done;
        ip addr add 10.0.2.2/30 dev eth1; ip addr add 10.0.12.2/30 dev eth2; ip addr add 10.2.0.1/30 dev eth3; ip addr add 10.2.1.1/30 dev eth4;
        ip addr add 10.255.0.2/32 dev lo;
        ip route del default dev eth0 2>/dev/null; sysctl -qw net.ipv4.ip_forward=1;
        exec isisd -c /etc/isis4r/isisd.yml -l -"
    r2:
      kind: linux
      image: isis4r:latest
      labels: { routescope.kind: isis4r, routescope.protocols: isis }
      binds: [r2:/etc/isis4r]
      entrypoint: sh
      cmd: >-
        -c "until ip link show eth2 >/dev/null 2>&1; do sleep 0.2; done;
        ip addr add 10.2.1.2/30 dev eth1; ip addr add 10.2.2.1/30 dev eth2;
        ip addr add 10.255.0.22/32 dev lo;
        ip route del default dev eth0 2>/dev/null; sysctl -qw net.ipv4.ip_forward=1;
        exec isisd -c /etc/isis4r/isisd.yml -l -"
    s2:
      kind: linux
      image: isis4r:latest
      labels: { routescope.kind: isis4r-sim, routescope.protocols: isis }
      binds: [s2:/lab]
      entrypoint: sh
      cmd: >-
        -c "until ip link show eth2 >/dev/null 2>&1; do sleep 0.2; done;
        ip addr add 10.2.0.2/30 dev eth1; ip addr add 10.2.2.2/30 dev eth2;
        ip addr add 10.255.0.12/32 dev lo;
        exec isis4r-sim -c /lab/sim.yml -l -"
    b3:
      kind: linux
      image: isis4r:latest
      labels: { routescope.kind: isis4r, routescope.protocols: isis }
      binds: [b3:/etc/isis4r]
      entrypoint: sh
      cmd: >-
        -c "until ip link show eth4 >/dev/null 2>&1; do sleep 0.2; done;
        ip addr add 10.0.3.2/30 dev eth1; ip addr add 10.3.0.1/30 dev eth3; ip addr add 10.3.1.1/30 dev eth4;
        ip addr add 10.255.0.3/32 dev lo;
        ip route del default dev eth0 2>/dev/null; sysctl -qw net.ipv4.ip_forward=1;
        exec isisd -c /etc/isis4r/isisd.yml -l -"
    r3:
      kind: linux
      image: isis4r:latest
      labels: { routescope.kind: isis4r, routescope.protocols: isis }
      binds: [r3:/etc/isis4r]
      entrypoint: sh
      cmd: >-
        -c "until ip link show eth2 >/dev/null 2>&1; do sleep 0.2; done;
        ip addr add 10.3.1.2/30 dev eth1; ip addr add 10.3.2.1/30 dev eth2;
        ip addr add 10.255.0.23/32 dev lo;
        ip route del default dev eth0 2>/dev/null; sysctl -qw net.ipv4.ip_forward=1;
        exec isisd -c /etc/isis4r/isisd.yml -l -"
    s3:
      kind: linux
      image: isis4r:latest
      labels: { routescope.kind: isis4r-sim, routescope.protocols: isis }
      binds: [s3:/lab]
      entrypoint: sh
      cmd: >-
        -c "until ip link show eth2 >/dev/null 2>&1; do sleep 0.2; done;
        ip addr add 10.3.0.2/30 dev eth1; ip addr add 10.3.2.2/30 dev eth2;
        ip addr add 10.255.0.13/32 dev lo;
        exec isis4r-sim -c /lab/sim.yml -l -"
  links:
    - endpoints: ["c0:eth1", "b1:eth1"]
    - endpoints: ["c0:eth2", "b2:eth1"]
    - endpoints: ["c0:eth3", "b3:eth1"]
    - endpoints: ["b1:eth2", "b2:eth2"]
    - endpoints: ["b1:eth3", "s1:eth1"]
    - endpoints: ["b1:eth4", "r1:eth1"]
    - endpoints: ["r1:eth2", "s1:eth2"]
    - endpoints: ["b2:eth3", "s2:eth1"]
    - endpoints: ["b2:eth4", "r2:eth1"]
    - endpoints: ["r2:eth2", "s2:eth2"]
    - endpoints: ["b3:eth3", "s3:eth1"]
    - endpoints: ["b3:eth4", "r3:eth1"]
    - endpoints: ["r3:eth2", "s3:eth2"]
