# b1, the border of area 49.0001: Level 1 with s1 and r1, Level 2 with
# the backbone. See ../isis4r-areas-core.clab.yml.
#
# eth1 faces c0, eth2 the other border: different areas, so only Level 2 comes
# up there (RFC 1142 section 7.1.3). eth3 faces s1 and eth4 faces r1.
# scenarios/leak.yml turns on policy.leak here: area 3's loopbacks go into
# Level 1 with the up/down bit (RFC 5302 section 2), and r1 prefers them
# to its default route.
system_id: 0000.0000.0001
hostname: b1
areas: [49.0001]
level: 1-2
metric_style: wide
forwarding: true
minimum_lsp_interval: 1
prefixes:
  - { prefix: 10.255.0.1/32, metric: 0 }
interfaces:
  - { name: eth1, ip_addresses: [10.0.1.2], metric: 10, hello_interval: 1, hello_multiplier: 3 }   # to c0
  - { name: eth2, ip_addresses: [10.0.12.1], metric: 10, hello_interval: 1, hello_multiplier: 3 }   # to b2
  - { name: eth3, ip_addresses: [10.1.0.1], metric: 10, hello_interval: 1, hello_multiplier: 3 }   # to s1
  - { name: eth4, ip_addresses: [10.1.1.1], metric: 10, hello_interval: 1, hello_multiplier: 3 }   # to r1
