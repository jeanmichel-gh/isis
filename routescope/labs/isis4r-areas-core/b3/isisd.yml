# b3, the border of area 49.0003: Level 1 with s3 and r3, Level 2 with
# the backbone. See ../isis4r-areas-core.clab.yml.
#
# eth1 faces c0: different areas, so only Level 2 comes
# up there (RFC 1142 section 7.1.3). eth3 faces s3 and eth4 faces r3.
# b3 has one way into the backbone, eth1 to c0. There is no eth2.
system_id: 0000.0000.0003
hostname: b3
areas: [49.0003]
level: 1-2
metric_style: wide
forwarding: true
minimum_lsp_interval: 1
prefixes:
  - { prefix: 10.255.0.3/32, metric: 0 }
interfaces:
  - { name: eth1, ip_addresses: [10.0.3.2], metric: 10, hello_interval: 1, hello_multiplier: 3 }   # to c0
  - { name: eth3, ip_addresses: [10.3.0.1], metric: 10, hello_interval: 1, hello_multiplier: 3 }   # to s3
  - { name: eth4, ip_addresses: [10.3.1.1], metric: 10, hello_interval: 1, hello_multiplier: 3 }   # to r3
