# b2, the border of area 49.0002: Level 1 with s2 and r2, Level 2 with
# the backbone. See ../isis4r-areas-core.clab.yml.
#
# eth1 faces c0, eth2 the other border: different areas, so only Level 2 comes
# up there (RFC 1142 section 7.1.3). eth3 faces s2 and eth4 faces r2.
# scenarios/summaries.yml turns on policy.summaries here: 10.202.0.0/24
# and 32.0.0.0/20 go into Level 2 in place of what they cover (RFC 1195
# section 3.2).
system_id: 0000.0000.0002
hostname: b2
areas: [49.0002]
level: 1-2
metric_style: wide
forwarding: true
minimum_lsp_interval: 1
prefixes:
  - { prefix: 10.255.0.2/32, metric: 0 }
interfaces:
  - { name: eth1, ip_addresses: [10.0.2.2], metric: 10, hello_interval: 1, hello_multiplier: 3 }   # to c0
  - { name: eth2, ip_addresses: [10.0.12.2], metric: 10, hello_interval: 1, hello_multiplier: 3 }   # to b1
  - { name: eth3, ip_addresses: [10.2.0.1], metric: 10, hello_interval: 1, hello_multiplier: 3 }   # to s2
  - { name: eth4, ip_addresses: [10.2.1.1], metric: 10, hello_interval: 1, hello_multiplier: 3 }   # to r2
