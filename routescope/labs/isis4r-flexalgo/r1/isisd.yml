# isis4r in the flex-algo lab. See ../isis4r-flexalgo.clab.yml.
system_id: 0000.0000.0001
hostname: r1
areas: [49.0001]
level: 1
metric_style: wide
minimum_lsp_interval: 1
forwarding: true
segment_routing:
  srgb: [{ start: 21000, size: 1000 }]
  srlb: { start: 15000, size: 1000 }
affinity_map: { red: 1 }
flex_algo:
  - { algorithm: 128, advertise: false }
  - { algorithm: 129, advertise: false }
prefixes:
  - { prefix: 10.255.0.1/32, metric: 0, sid: 1, algorithm_sids: { 128: 101, 129: 201 } }
interfaces:
  - { name: eth1, ip_addresses: [10.0.12.1], metric: 10, delay: 20000, affinity: [red], hello_interval: 1, hello_multiplier: 10, ti_lfa: link }
  - { name: eth2, ip_addresses: [10.0.17.1], metric: 15, delay: 5000, hello_interval: 1, hello_multiplier: 10, ti_lfa: link }
  - { name: eth3, ip_addresses: [10.0.13.1], metric: 20, delay: 2000, hello_interval: 1, hello_multiplier: 10, ti_lfa: link }
