# isis4r in the flex-algo lab. See ../isis4r-flexalgo.clab.yml.
system_id: 0000.0000.0002
hostname: r2
areas: [49.0001]
level: 1
metric_style: wide
minimum_lsp_interval: 1
forwarding: true
segment_routing:
  srgb: [{ start: 22000, size: 1000 }]
  srlb: { start: 15000, size: 1000 }
affinity_map: { red: 1 }
flex_algo:
  - { algorithm: 128, advertise: false }
  - { algorithm: 129, advertise: false }
prefixes:
  - { prefix: 10.255.0.2/32, metric: 0, sid: 2, algorithm_sids: { 128: 102, 129: 202 } }
interfaces:
  - { name: eth1, ip_addresses: [10.0.12.2], metric: 10, delay: 20000, affinity: [red], hello_interval: 1, hello_multiplier: 10 }
  - { name: eth2, ip_addresses: [10.0.24.1], metric: 10, delay: 20000, affinity: [red], hello_interval: 1, hello_multiplier: 10 }
