frr version 10.7.1_git
frr defaults traditional
hostname f1
log stdout informational
service integrated-vtysh-config
!
affinity-map red bit-position 1
!
interface lo
 ip address 10.255.0.7/32
 ip router isis 1
 isis passive
exit
!
interface eth1
 ip address 10.0.17.2/30
 ip router isis 1
 isis network point-to-point
 isis metric 15
 isis hello-interval 1
 isis hello-multiplier 10
 link-params
  delay 5000 min 5000 max 5000
 exit-link-params
exit
!
interface eth2
 ip address 10.0.47.2/30
 ip router isis 1
 isis network point-to-point
 isis metric 15
 isis hello-interval 1
 isis hello-multiplier 10
 link-params
  delay 5000 min 5000 max 5000
 exit-link-params
exit
!
router isis 1
 net 49.0001.0000.0000.0007.00
 is-type level-1
 metric-style wide
 lsp-gen-interval 1
 mpls-te on
 mpls-te router-address 10.255.0.7
 segment-routing on
 segment-routing global-block 16000 16999
 segment-routing local-block 15000 15999
 segment-routing prefix 10.255.0.7/32 index 7
 segment-routing prefix 10.255.0.7/32 algorithm 128 index 107
 segment-routing prefix 10.255.0.7/32 algorithm 129 index 207
 flex-algo 128
  dataplane sr-mpls
 exit
 flex-algo 129
  dataplane sr-mpls
  advertise-definition
  priority 200
  affinity exclude-any red
 exit
exit
