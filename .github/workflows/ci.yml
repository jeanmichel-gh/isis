name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # What this run tests, as a fingerprint (.github/ci/fingerprint.sh): the
  # tree but CLAUDE.md and docs/design/, which no test reads, and the
  # commits of datalink-socket and bfd4r. On a pull request, when a run
  # with the same fingerprint passed (the ci job records it in the cache),
  # the test jobs are skipped and ci passes on that earlier run: a rebase
  # that only resolves a conflict in CLAUDE.md, say. The check for
  # conflict markers runs every time. A push to master always runs all.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      fingerprint: ${{ steps.fingerprint.outputs.value }}
      reuse: ${{ github.event_name == 'pull_request' && steps.passed.outputs.cache-hit == 'true' }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: No conflict markers
        run: .github/ci/markers.sh
      - name: Fingerprint
        id: fingerprint
        run: echo "value=$(.github/ci/fingerprint.sh)" >> "$GITHUB_OUTPUT"
      - name: A run with this fingerprint passed
        id: passed
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v6
        with:
          path: .ci-passed
          key: ci-passed-${{ steps.fingerprint.outputs.value }}
          lookup-only: true

  test:
    name: test (Ruby ${{ matrix.ruby }})
    needs: changes
    if: needs.changes.outputs.reuse != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # From the gemspec's required_ruby_version (>= 3.2) to the newest,
        # on every pull request and push. isis is public since 2026-11-15,
        # so its runs are free; while it was private a pull request ran
        # 3.4 alone to save billed minutes (#81). 3.1 left with bfd4r,
        # which needs 3.2 (2026-11-21).
        ruby: ["3.2", "3.3", "3.4", "4.0"]
    steps:
      - uses: actions/checkout@v6
        with:
          path: isis
          persist-credentials: false

      # datalink-socket and bfd4r are path dependencies (../datalink-socket
      # and ../bfd4r in the Gemfile), so check them out beside this
      # repository.
      - uses: actions/checkout@v6
        with:
          repository: jeanmichel-gh/datalink-socket
          path: datalink-socket
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: jeanmichel-gh/bfd4r
          path: bfd4r
          persist-credentials: false

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          working-directory: isis
          bundler-cache: true

      - name: Unit tests
        working-directory: isis
        run: bundle exec rake test

      - name: Gem builds without warnings
        working-directory: isis
        run: |
          gem build isis4r.gemspec 2>&1 | tee build.log
          ! grep -i "warning" build.log

  # Phase gates against an independent router: FRR's isisd in one network
  # namespace and isis4r in another, joined by a veth pair. Needs root,
  # which the runner gives through sudo. test/support/frr_lab.rb has the
  # harness, after ospfv2's interop-frr job.
  interop-frr:
    name: interop (FRR)
    needs: changes
    if: needs.changes.outputs.reuse != 'true'
    runs-on: ubuntu-latest
    # 4 minutes since #79. Before it, 22; one run took 62. Without a
    # timeout a hung run is billed for up to six hours.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          path: isis
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: jeanmichel-gh/datalink-socket
          path: datalink-socket
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: jeanmichel-gh/bfd4r
          path: bfd4r
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          working-directory: isis
          bundler-cache: true
      - name: Install FRR and iproute2
        run: sudo apt-get update -qq && sudo apt-get install -y -qq frr iproute2 iputils-ping
      - name: FRR version
        run: /usr/lib/frr/isisd --version | head -1
      # ubuntu-latest moved from 24.04 to 26.04 between 6 and 9 November
      # 2026. 26.04 ships an AppArmor profile for isisd that allows only
      # FRR's default paths, so the lab's isisd cannot write its pid file
      # and every interop test fails (see FrrLab.isisd_confined?). The
      # runner is thrown away after the job, so unload the profile, which
      # is the way round it FrrLab's own message gives. 24.04 has no
      # profile and this does nothing there.
      - name: Unload the isisd AppArmor profile
        run: |
          if [ -f /etc/apparmor.d/isisd ]; then
            sudo apparmor_parser -R /etc/apparmor.d/isisd
            echo "isisd profile unloaded"
          else
            echo "no isisd profile"
          fi
          grep '^isisd ' /sys/kernel/security/apparmor/profiles || echo "isisd not confined"
      # test/interop/kernel_backup_test.rb pushes labels on IP routes, which
      # needs mpls_iptunnel. Load it, with linux-modules-extra for the
      # running kernel if the image lacks the module.
      - name: Load the MPLS modules
        run: |
          if ! sudo modprobe mpls_iptunnel 2>/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq "linux-modules-extra-$(uname -r)"
            sudo modprobe mpls_iptunnel
          fi
          sudo modprobe mpls_router
          lsmod | grep '^mpls'
      - name: Interop tests against FRR
        working-directory: isis
        run: sudo -E env "PATH=$PATH" ISIS_FRR=1 bundle exec rake interop

  # The fault matrix, `rake fault_matrix`: TI-LFA's topologies on real
  # routers (test/interop/frr_ti_lfa_test.rb, a namespace per system, up
  # to 33 isisd at once), the SR entries (frr_sr_fault_test.rb) and the
  # packets at the PLR (kernel_ti_lfa_test.rb), one file at a time. The
  # topologies took the FRR job from under 4 minutes to 9 to 11
  # (2026-11-22), near its limit, so they run here, beside it. The
  # runner's FRR was 10.5.1, whose answers the tests record, so both
  # halves ran: 19 tests in 619 s (#122). On another FRR the FRR half is
  # measured for the matrix and not held to 10.5.1's. The document it
  # writes, docs/fault-matrix.md, is kept as an artifact; on a loaded
  # machine ti_lfa_too_deep's 33 routers lose their adjacencies, so the
  # one in the repository comes from here.
  interop-ti-lfa:
    name: interop (TI-LFA)
    needs: changes
    if: needs.changes.outputs.reuse != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          path: isis
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: jeanmichel-gh/datalink-socket
          path: datalink-socket
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: jeanmichel-gh/bfd4r
          path: bfd4r
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          working-directory: isis
          bundler-cache: true
      - name: Install FRR and iproute2
        run: sudo apt-get update -qq && sudo apt-get install -y -qq frr iproute2
      - name: FRR version
        run: /usr/lib/frr/isisd --version | head -1
      # As in the FRR job: 26.04's AppArmor profile keeps the lab's isisd
      # from its pid file.
      - name: Unload the isisd AppArmor profile
        run: |
          if [ -f /etc/apparmor.d/isisd ]; then
            sudo apparmor_parser -R /etc/apparmor.d/isisd
            echo "isisd profile unloaded"
          else
            echo "no isisd profile"
          fi
      # kernel_ti_lfa_test.rb pushes labels, as the FRR job's tests do.
      - name: Load the MPLS modules
        run: |
          if ! sudo modprobe mpls_iptunnel 2>/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq "linux-modules-extra-$(uname -r)"
            sudo modprobe mpls_iptunnel
          fi
          sudo modprobe mpls_router
          lsmod | grep '^mpls'
      - name: The fault matrix
        working-directory: isis
        run: sudo -E env "PATH=$PATH" ISIS_FRR=1 bundle exec rake fault_matrix
      - name: Keep docs/fault-matrix.md
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fault-matrix
          path: isis/docs/fault-matrix.md

  # The gates against a second independent implementation, Nokia SR
  # Linux, so a reading isis4r and FRR share cannot pass unseen.
  # containerlab runs SR Linux, and test/support/srl_lab.rb joins it to
  # isis4r in a network namespace. CLAUDE.md, "Labs and interop", says why
  # SR Linux. The image tag is the one SrlLab::IMAGE names.
  interop-srl:
    name: interop (SR Linux)
    needs: changes
    if: needs.changes.outputs.reuse != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          path: isis
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: jeanmichel-gh/datalink-socket
          path: datalink-socket
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: jeanmichel-gh/bfd4r
          path: bfd4r
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          working-directory: isis
          bundler-cache: true
      - name: containerlab and SR Linux
        run: |
          bash -c "$(curl -sL https://get.containerlab.dev)"
          docker pull -q ghcr.io/nokia/srlinux:26.7.2
      - name: Interop tests against SR Linux
        working-directory: isis
        run: sudo -E env "PATH=$PATH" ISIS_SRL=1 bundle exec rake interop_srl

  # The example lab, routescope/labs/isis4r-frr: the isis4r image
  # builds and the unit tests pass inside it, then containerlab runs it
  # beside FRR and test/lab/isis4r-frr.sh checks the routing through it.
  lab-containerlab:
    name: lab (containerlab)
    needs: changes
    if: needs.changes.outputs.reuse != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          path: isis
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: jeanmichel-gh/datalink-socket
          path: datalink-socket
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: jeanmichel-gh/bfd4r
          path: bfd4r
          persist-credentials: false
      - name: The image, and the unit tests in it
        working-directory: isis
        run: |
          test/lab/bases.sh Dockerfile
          docker build --target test --build-context datalink-socket=../datalink-socket --build-context bfd4r=../bfd4r .
          docker build -t isis4r --build-context datalink-socket=../datalink-socket --build-context bfd4r=../bfd4r .
      - name: containerlab and FRR
        run: |
          bash -c "$(curl -sL https://get.containerlab.dev)"
          docker pull -q quay.io/frrouting/frr:10.7.1
      - name: The isis4r-frr lab
        working-directory: isis
        run: sudo test/lab/isis4r-frr.sh clab

  # The one check to require before merging. It passes only if every
  # matrix job, the FRR, TI-LFA and SR Linux interop jobs and the lab job passed, so adding or removing a Ruby version never means
  # editing the branch rules. A skipped job counts as a failure here,
  # except when the changes job found a passed run with this fingerprint.
  # A full pass is recorded under its fingerprint, for later runs.
  ci:
    name: ci
    if: always()
    needs: [changes, test, interop-frr, interop-ti-lfa, interop-srl, lab-containerlab]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All test jobs passed
        run: |
          echo "changes: ${{ needs.changes.result }}, reuse ${{ needs.changes.outputs.reuse }}"
          echo "fingerprint: ${{ needs.changes.outputs.fingerprint }}"
          test "${{ needs.changes.result }}" = "success"
          if [ "${{ needs.changes.outputs.reuse }}" = "true" ]; then
            echo "a run with this fingerprint passed: the test jobs were skipped"
            exit 0
          fi
          echo "test: ${{ needs.test.result }}"
          echo "interop-frr: ${{ needs.interop-frr.result }}"
          echo "interop-ti-lfa: ${{ needs.interop-ti-lfa.result }}"
          echo "interop-srl: ${{ needs.interop-srl.result }}"
          echo "lab-containerlab: ${{ needs.lab-containerlab.result }}"
          test "${{ needs.test.result }}" = "success"
          test "${{ needs.interop-frr.result }}" = "success"
          test "${{ needs.interop-ti-lfa.result }}" = "success"
          test "${{ needs.interop-srl.result }}" = "success"
          test "${{ needs.lab-containerlab.result }}" = "success"
      - name: Record the pass
        if: needs.changes.outputs.reuse != 'true'
        run: echo "${{ needs.changes.outputs.fingerprint }}" > .ci-passed
      - name: Save the record
        if: needs.changes.outputs.reuse != 'true'
        uses: actions/cache/save@v6
        with:
          path: .ci-passed
          key: ci-passed-${{ needs.changes.outputs.fingerprint }}
