name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (Ruby ${{ matrix.ruby }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # From the gemspec's required_ruby_version (>= 3.1) to the newest.
        ruby: ["3.1", "3.2", "3.3", "3.4", "4.0"]
    steps:
      - uses: actions/checkout@v6
        with:
          path: isis
          persist-credentials: false

      # datalink-socket is a path dependency (../datalink-socket in the
      # Gemfile), so check it out beside this repository.
      - uses: actions/checkout@v6
        with:
          repository: jeanmichel-gh/datalink-socket
          path: datalink-socket
          persist-credentials: false

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          working-directory: isis
          bundler-cache: true

      - name: Unit tests
        working-directory: isis
        run: bundle exec rake test

      - name: Gem builds without warnings
        working-directory: isis
        run: |
          gem build isis4r.gemspec 2>&1 | tee build.log
          ! grep -i "warning" build.log

  # The one check to require before merging. It passes only if every
  # matrix job passed, so adding or removing a Ruby version never means
  # editing the branch rules. A skipped job counts as a failure here.
  ci:
    name: ci
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: All test jobs passed
        run: |
          echo "test: ${{ needs.test.result }}"
          test "${{ needs.test.result }}" = "success"
